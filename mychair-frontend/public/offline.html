<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyChair - Offline</title>
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <style>
      :root {
        --color-brand-gold: #c5a059;
        --color-brand-gold-dark: #a38242;
        --color-surface-bg: #fdfbf7;
        --color-text-primary: #1f1f1e;
        --color-text-secondary: #6b6b66;
        --color-border-soft: #f0ebe1;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--color-surface-bg);
        color: var(--color-text-primary);
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .offline-card {
        background: #ffffff;
        border: 1px solid var(--color-border-soft);
        border-radius: 24px;
        padding: 40px 28px;
        max-width: 440px;
        width: 100%;
        text-align: center;
        box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05);
      }
      .icon-container {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 20px;
        background: #f7f2e8;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--color-border-soft);
      }
      .icon-container svg {
        width: 36px;
        height: 36px;
        color: var(--color-brand-gold-dark);
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 12px;
        color: var(--color-text-primary);
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: var(--color-text-secondary);
        margin-bottom: 24px;
      }
      .notice {
        font-size: 12px;
        line-height: 1.5;
        background: #fdfbf7;
        border: 1px solid var(--color-border-soft);
        border-radius: 12px;
        padding: 12px 14px;
        color: var(--color-text-secondary);
        margin-bottom: 24px;
      }
      .retry-btn {
        display: inline-block;
        width: 100%;
        padding: 14px 20px;
        background: var(--color-brand-gold);
        color: #ffffff;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 14px;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .retry-btn:hover {
        background: var(--color-brand-gold-dark);
      }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="icon-container">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-5.657-2.828m0 0l2.829-2.829m-2.829 2.829L3 21m3.536-12.536a5 5 0 017.071 0" />
        </svg>
      </div>
      <h1>MyChair is Offline</h1>
      <p>
        Please check your internet connection and try again.
      </p>
      <div class="notice">
        Attendance, earnings, leave requests, and other live salon data require an active internet connection to ensure operational accuracy.
      </div>
      <button class="retry-btn" onclick="window.location.reload()">
        Check Connection & Retry
      </button>
    </div>
  </body>
</html>
